<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F4; --sheet:#FFFFFF; --ink:#1B2430; --muted:#5B6675;
  --line:#D5DBE3; --accent:#2F5BEA; --accent-ink:#FFFFFF; --soft:#E1E7F5;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}

/* Buttons */
.btn{display:inline-block;font:600 16px var(--body);padding:14px 26px;border-radius:999px;border:2px solid var(--ink);background:transparent;color:var(--ink);text-decoration:none;cursor:pointer}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#1F44C4;border-color:#1F44C4}

/* Hero */
.hero{min-height:min(88vh,760px);display:grid;grid-template-columns:1.25fr .75fr;gap:48px;align-items:center;padding:56px 0}
.hero h1{font:800 clamp(44px,8vw,96px)/.95 var(--display);letter-spacing:-.03em}
.hero .role{font:500 clamp(20px,2.6vw,28px)/1.3 var(--display);color:var(--accent);margin:20px 0 18px}
.hero .intro{max-width:52ch;color:var(--muted);font-size:19px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.photo{aspect-ratio:4/5;border-radius:999px 999px 24px 24px;overflow:hidden;background:var(--soft);display:grid;place-items:center}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.photo .initials{font:800 96px var(--display);color:var(--accent)}

/* Strengths */
.strengths{display:grid;grid-template-columns:repeat(2,1fr);gap:0 48px}
.strength{padding:20px 0;border-top:1px solid var(--line)}
.strength h3{font:700 20px/1.25 var(--display);color:var(--accent)}
.strength p{color:var(--muted);margin-top:4px}
.cv-main li b{font-weight:600}

/* Certifications */
.cert{padding:24px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cert h3{font:700 22px/1.25 var(--display)}
.cert .meta{color:var(--muted);margin:4px 0 14px}
.cert .actions{margin-top:20px}
.cert .btn{padding:10px 20px;font-size:15px}

/* Projects */
section.block{padding:64px 0;border-top:1px solid var(--line)}
h2{font:700 clamp(28px,4vw,40px)/1.1 var(--display);letter-spacing:-.02em;margin-bottom:32px}
.project{display:grid;grid-template-columns:90px 1fr auto;gap:24px;padding:24px 0;border-bottom:1px solid var(--line);align-items:baseline}
.project:first-of-type{border-top:1px solid var(--line)}
.project .year{color:var(--muted);font-weight:500}
.project h3{font:700 22px/1.25 var(--display)}
.project h3 a{text-decoration:none;border-bottom:2px solid var(--accent)}
.project p{color:var(--muted);margin-top:6px;max-width:60ch}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.tag{font-size:14px;padding:2px 12px;border-radius:999px;background:var(--soft)}
footer{padding:64px 0 80px;border-top:1px solid var(--line)}
footer .links{display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:20px}
footer a{font-weight:600}

/* CV view */
#cv{display:none;padding:32px 0 80px}
body.show-cv #home{display:none}
body.show-cv #cv{display:block}
.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.toolbar .btn{padding:10px 20px;font-size:15px}
.sheet{background:var(--sheet);max-width:900px;margin:0 auto;border-radius:12px;box-shadow:0 8px 40px rgba(27,36,48,.12);overflow:hidden}
.cv-head{display:flex;gap:24px;align-items:center;padding:40px 48px;background:var(--ink);color:#fff}
.cv-head .photo{width:112px;height:112px;aspect-ratio:1;border-radius:50%;flex:none;position:relative;overflow:hidden}
.cv-head .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;border-radius:50%}
.cv-head .photo .initials{font-size:40px}
.cv-head h2{margin:0;color:#fff;font-size:clamp(28px,5vw,40px)}
.cv-head p{color:#B9C4D6;margin-top:4px;font-size:18px}
.cv-body{display:grid;grid-template-columns:260px 1fr}
.cv-side{background:#F6F8FA;padding:32px 28px;border-right:1px solid var(--line)}
.cv-main{padding:32px 40px}
.cv h4{font:700 18px var(--display);margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--accent);display:inline-block}
.cv-side section,.cv-main section{margin-bottom:28px}
.cv-side p,.cv-side li{font-size:15px}
.cv ul{padding-left:18px}
.cv li{margin:3px 0}
.cv-side ul{list-style:none;padding:0}
.job{margin-bottom:20px}
.job .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.job strong{font:700 17px var(--display)}
.job .when{color:var(--muted);font-size:15px}
.job .org{color:var(--accent);font-weight:600;font-size:15px}
.group{margin-bottom:12px}
.group b{display:block;font-size:14px;color:var(--muted);font-weight:600}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;min-height:0;gap:32px}
  .photo{max-width:280px;order:-1}
  .strengths{grid-template-columns:1fr}
  .project{grid-template-columns:1fr;gap:6px}
  .tags{justify-content:flex-start;margin-top:8px}
  .cv-body{grid-template-columns:1fr}
  .cv-side{border-right:0;border-bottom:1px solid var(--line)}
  .cv-head{padding:28px 24px}.cv-main{padding:28px 24px}
}
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff;width:210mm;height:296mm;margin:0;padding:0;overflow:hidden;font-size:15px;line-height:1.5}
  #home,.toolbar{display:none!important}
  #cv{display:block!important;padding:0}
  .wrap{padding:0;max-width:none;margin:0}
  /* One A4 page: sheet is exactly one page tall and never spills over */
  .sheet{box-shadow:none;border-radius:0;max-width:none;width:210mm;height:296mm;overflow:hidden;display:flex;flex-direction:column;break-inside:avoid;page-break-after:avoid}
  .cv-head,.cv-side{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cv-head{padding:30px 36px;gap:24px;flex:none}
  .cv-head .photo{width:112px;height:112px}
  .cv-head .photo .initials{font-size:40px}
  .cv-head h2{font-size:36px}
  .cv-head p{font-size:16px;margin-top:4px}
  .cv-body{grid-template-columns:240px 1fr;flex:1;min-height:0}
  .cv-side{padding:28px 24px}
  .cv-main{padding:28px 34px}
  .cv h4{font-size:18px;margin-bottom:10px;padding-bottom:4px}
  .cv-side section,.cv-main section{margin-bottom:24px}
  .cv-side p,.cv-side li{font-size:14.5px}
  .cv li{margin:3px 0;font-size:15px}
  .job{margin-bottom:16px;break-inside:avoid}
  .job strong{font-size:17px}
  .job .when,.job .org{font-size:14.5px}
  .group{margin-bottom:12px;font-size:14.5px}
  .group b{font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>

<main>
  <!-- HOME -->
  <div id="home">
    <div class="wrap">
      <header class="hero">
        <div>
          <h1 id="h-name"></h1>
          <p class="role" id="h-role"></p>
          <p class="intro" id="h-intro"></p>
          <div class="actions">
            <a class="btn primary" href="#cv" id="cv-btn">View my CV</a>
            <a class="btn" href="#projects">See my work</a>
          </div>
        </div>
        <div class="photo" id="h-photo"></div>
      </header>

      <section class="block" id="about">
        <h2>What I bring</h2>
        <div class="strengths" id="strength-list"></div>
      </section>

      <section class="block" id="projects">
        <h2>Selected work</h2>
        <div id="project-list"></div>
      </section>

      <section class="block" id="certifications">
        <h2>Certifications</h2>
        <div id="cert-list"></div>
      </section>

      <footer id="contact">
        <h2>Get in touch</h2>
        <p id="f-text"></p>
        <div class="links" id="f-links"></div>
      </footer>
    </div>
  </div>

  <!-- CV -->
  <div id="cv" class="cv">
    <div class="wrap">
      <div class="toolbar">
        <a class="btn" href="#">Back to portfolio</a>
        <a class="btn primary" id="dl-btn" href="#">Download PDF</a>
      </div>
      <article class="sheet">
        <div class="cv-head">
          <div class="photo" id="c-photo"></div>
          <div><h2 id="c-name"></h2><p id="c-role"></p></div>
        </div>
        <div class="cv-body">
          <aside class="cv-side" id="c-side"></aside>
          <div class="cv-main" id="c-main"></div>
        </div>
      </article>
    </div>
  </div>
</main>

<script>
(function () {
  const d = DATA;
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const initials = d.name.split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();

  document.title = d.name + " — " + d.role;

  // Photo, with initials fallback if the image file is missing
  function setPhoto(el) {
    const img = new Image();
    img.alt = d.name;
    img.onerror = () => { el.innerHTML = '<span class="initials">' + esc(initials) + '</span>'; };
    img.src = d.photo;
    el.appendChild(img);
  }
  setPhoto($("h-photo")); setPhoto($("c-photo"));

  // Home
  $("h-name").textContent = d.name;
  $("h-role").textContent = d.role;
  $("h-intro").textContent = d.intro;

  $("strength-list").innerHTML = d.strengths.map(x =>
    '<div class="strength"><h3>' + esc(x.title) + '</h3><p>' + esc(x.text) + '</p></div>').join("");

  $("project-list").innerHTML = d.projects.map(p => {
    const title = p.url ? '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.title) + '</a>' : esc(p.title);
    return '<div class="project"><span class="year">' + esc(p.year) + '</span>' +
      '<div><h3>' + title + '</h3><p>' + esc(p.description) + '</p></div>' +
      '<div class="tags">' + (p.tags || []).map(t => '<span class="tag">' + esc(t) + '</span>').join("") + '</div></div>';
  }).join("");

  $("cert-list").innerHTML = d.certifications.map(c =>
    '<div class="cert"><h3>' + esc(c.title) + '</h3>' +
    '<p class="meta">' + esc(c.issuer) + ' · ' + esc(c.period) + '</p>' +
    '<div class="tags" style="justify-content:flex-start">' + c.topics.map(t => '<span class="tag">' + esc(t) + '</span>').join("") + '</div>' +
    (c.image ? '<div class="actions"><a class="btn" href="' + esc(c.image) + '" target="_blank" rel="noopener">View certificate</a></div>' : '') +
    '</div>').join("");

  $("f-text").textContent = "Open to new projects and roles. Call or message me anytime.";
  $("f-links").innerHTML =
    '<a href="mailto:' + esc(d.email) + '">' + esc(d.email) + '</a>' +
    '<a href="tel:' + esc(d.phone.replace(/\s+/g, "")) + '">' + esc(d.phone) + '</a>' +
    d.links.map(l => '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + '</a>').join("");

  // CV
  $("c-name").textContent = d.name;
  $("c-role").textContent = d.role;

  $("c-side").innerHTML =
    '<section><h4>Contact</h4><ul>' +
      '<li>' + esc(d.email) + '</li><li>' + esc(d.phone) + '</li><li>' + esc(d.location) + '</li>' +
      d.links.map(l => '<li>' + esc(l.label) + ': ' + esc(l.url.replace(/^https?:\/\//, "")) + '</li>').join("") +
    '</ul></section>' +
    '<section><h4>Skills</h4>' +
      d.skills.map(g => '<div class="group"><b>' + esc(g.group) + '</b>' + esc(g.items.join(", ")) + '</div>').join("") +
    '</section>' +
    '<section><h4>Education</h4>' +
      d.education.map(e => '<div class="group"><strong>' + esc(e.degree) + '</strong><br>' + esc(e.school) + '<br><span style="color:var(--muted)">' + esc(e.period) + '</span>' + (e.courses ? '<br><span style="font-size:14px">Courses: ' + esc(e.courses) + '</span>' : '') + '</div>').join("") +
    '</section>' +
    '<section><h4>Languages</h4><ul>' + d.languages.map(l => '<li>' + esc(l) + '</li>').join("") + '</ul></section>';

  $("c-main").innerHTML =
    '<section><h4>Profile</h4><p>' + esc(d.summary) + '</p></section>' +
    '<section><h4>Experience</h4>' +
      d.experience.map(j =>
        '<div class="job"><div class="top"><strong>' + esc(j.role) + '</strong><span class="when">' + esc(j.period) + '</span></div>' +
        '<div class="org">' + esc(j.company) + '</div>' +
        '<ul>' + j.points.map(p => '<li>' + esc(p) + '</li>').join("") + '</ul></div>'
      ).join("") +
    '</section>' +
    '<section><h4>Certifications</h4>' +
      d.certifications.map(c =>
        '<div class="job"><div class="top"><strong>' + esc(c.title) + '</strong><span class="when">' + esc(c.period) + '</span></div>' +
        '<div class="org">' + esc(c.issuer) + '</div>' +
        '</div>'
      ).join("") +
    '</section>';

  // Download button: real PDF if provided, otherwise browser print-to-PDF
  const dl = $("dl-btn");
  if (d.cvPdf) { dl.href = d.cvPdf; dl.setAttribute("download", ""); }
  else dl.addEventListener("click", e => { e.preventDefault(); window.print(); });

  // Switch between portfolio and CV using the URL hash
  function route() {
    const showCv = location.hash === "#cv";
    document.body.classList.toggle("show-cv", showCv);
    if (showCv) window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
